# Content source for the social post generator.
#
# This file is the SINGLE SOURCE OF TRUTH for post facts. The generator is
# instructed to use ONLY the `facts` text below and never invent numbers/prices.
# Keep `facts` accurate — verify prices before a run (the site has price-audit history).
#
# Link resolution per language:
#   - ja lives at the site root (no /ja/ prefix); other langs live under /<lang>/.
#   - If a language has no real page for `path` (e.g. zh-cn has no /sim/, or a page is
#     a redirect stub), the generator falls back via `link_lang_fallback`, then to ja.
#   - Post TEXT is always written in the audience's language even when the LINK is ja.

site:
  base_url: https://japanmobilesim.com
  languages: [ja, en, zh-tw, zh-cn, vi, my, th]
  brand_name: "暮らしお得 / Japan Mobile SIM"
  # Neutral, honest voice — show pros AND cons, never pushy or hypey.
  voice: >-
    Honest and neutral. Show trade-offs (pros and cons), never overpromise, no hype
    or clickbait. Helpful peer tone, not a hard sell. Numbers must match the facts exactly.

items:
  - id: sim-savings
    type: comparison
    path: /sim/
    image: assets/og-{lang}.png
    languages: all
    facts: >-
      10 mobile carriers compared neutrally with real pros AND cons (prices checked Nov 2026).
      Unlimited data: Rakuten Mobile ¥3,278/month vs docomo ¥8,448, au ¥7,788, SoftBank
      Teigaku Unlimited ¥8,008 (no discounts). Light use: IIJmio 5GB ¥950/month, LINEMO 3GB ¥990.
      Measured average speeds (みんなのネット回線速度, Nov 2026): fastest download au 162 Mbps,
      docomo 149, SoftBank 143; Rakuten Mobile 105 Mbps download but the fastest upload of the
      10 (26 Mbps). MVNOs like IIJmio and mineo slow down at lunchtime.

  - id: fixed-cost-savings
    type: overview
    path: /
    image: assets/og-{lang}.png
    languages: all
    facts: >-
      Reviewing your fixed monthly costs — mainly phone plan and credit cards — can save up to
      about ¥63,984 per year in the site's calculator example (major carrier + low-reward card
      switched to a budget SIM + higher-reward card). The site gives neutral, no-hype comparisons in multiple languages
      for people living in Japan.

  - id: rakuten-campaign
    type: campaign
    path: /guides/referral/
    image: assets/og-{lang}.png
    languages: all
    verify_before_posting: true   # campaign terms/points change — re-check the guide first
    facts: >-
      Step-by-step guide (real screenshots) to applying for Rakuten Mobile through a Rakuten
      Group employee's referral link. Anyone except Rakuten employees can use it, including
      people adding a 2nd line or re-contracting (max 5 lines). Points for applications from
      2026-09-17: 14,000 points when switching with your number (MNP), 13,000 points for other
      sign-ups; paid in 3 installments in months 4-6 after the referral login. You must log in
      via the referral link before applying and make a 10+ second call from the Rakuten Link app
      by the end of the 2nd month. The site operator is a Rakuten Group employee and receives a
      reward from Rakuten for sign-ups via the link (never state any reward details).

  - id: rakuten-registration
    type: guide
    path: /guides/rakuten-registration/
    image: assets/og-{lang}.png
    languages: all
    facts: >-
      Step-by-step guide (with screenshots) to creating a Rakuten account (Rakuten ID),
      which is needed for Rakuten Mobile, Rakuten Card, and Rakuten Ichiba.

  - id: credit-cards
    type: comparison
    path: /credit-cards/
    image: assets/og-{lang}.png
    languages: all
    link_lang_fallback: { en: ja, zh-tw: ja, zh-cn: ja, vi: ja, my: ja, th: ja }  # JA-only page
    facts: >-
      Credit cards compared for 2026 by reward rate (還元率), annual fee (年会費), and miles,
      to help find the best card for your spending. Neutral comparison.

  - id: money-saving-tip
    type: evergreen
    path: /
    image: assets/og-{lang}.png
    languages: all
    facts: >-
      The two biggest levers for cutting costs in Japan are switching your SIM/phone plan
      and choosing the right credit card. The site gives honest side-by-side comparisons —
      trade-offs included, not just the upsides.
