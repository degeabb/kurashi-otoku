    item: sim-savings
    text: |-
      スマホ代、無制限プランだけで比べても差は大きいです。
      楽天モバイル ¥3,278／月、ドコモ ¥8,448、au ¥7,788、ソフトバンク（テイガク無制限）¥8,008（いずれも割引なし・2026年11月確認）。
      ただし平均速度はau・ドコモが上位。料金と速度のどちらを優先するかで選び方が変わります。10社のメリット・デメリットをまとめました👇
      https://japanmobilesim.com/sim/
