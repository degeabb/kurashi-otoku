  - id: 2026-11-22-ja-referral-guide
    date: 2026-11-22
    lang: ja
    item: rakuten-campaign
    text: |-
      楽天モバイルを楽天従業員の紹介リンクから申し込むと、電話番号そのまま乗り換えで14,000ポイント、それ以外は13,000ポイント（2026年9月17日以降の申し込み）。
