name: Threads daily post

on:
  schedule:
    - cron: "0 11 * * *"        # 20:00 JST every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show the next post, don't publish)"
        type: boolean
        default: true

permissions:
  contents: write                # commit social/posted.yaml after a successful post

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "PyYAML>=6.0" "Jinja2>=3.1"
      - name: Post next approved draft
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python social/post_threads.py --dry-run
          else
            python social/post_threads.py
          fi
      - name: Record what was posted
        run: |
          if [ -n "$(git status --porcelain social/posted.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add social/posted.yaml
            git commit -m "chore: record Threads post [skip ci]"
            git push
          fi
